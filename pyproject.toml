[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cps-ai"
version = "1.0.0"
description = "C.P.S. — Universal AI Coding Companion, Browser Extension & Security Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "C.P.S. Team" }
]
dependencies = [
    "PySide6>=6.7,<7",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "bandit>=1.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]
api = ["fastapi>=0.100", "uvicorn>=0.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cps", "cps.*", "backend", "backend.*", "desktop", "desktop.*", "vulnquest", "vulnquest.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
