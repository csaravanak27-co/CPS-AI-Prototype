name: Windows Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked build dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Install package
        run: python -m pip install --no-deps --no-build-isolation --editable .

      - name: Run tests and desktop self-check
        shell: powershell
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -v
          python app.py --self-check

      - name: Validate extension and source release archives
        run: |
          python scripts/validate_extension.py
          python scripts/package_release.py

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build PyInstaller artifact and Inno Setup installer
        shell: powershell
        run: .\scripts\build_windows.ps1 -BuildInstaller

      - name: Validate expected release artifacts
        shell: powershell
        run: |
          $required = @("dist/cps-extension-v*.zip", "dist/cps-v*-release.zip", "dist/cps-desktop-v*-windows-x64.zip", "dist/SHA256SUMS.txt")
          foreach ($pattern in $required) {
            if (-not (Get-ChildItem $pattern -ErrorAction SilentlyContinue)) { throw "Missing expected release artifact: $pattern" }
          }
          if (-not (Get-ChildItem "dist/installer/*.exe" -ErrorAction SilentlyContinue)) { throw "Missing Inno Setup installer" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cps-windows-${{ github.ref_name }}
          path: |
            dist/cps-extension-v*.zip
            dist/cps-v*-release.zip
            dist/cps-desktop-v*-windows-x64.zip
            dist/SHA256SUMS.txt
            dist/installer/*.exe
          if-no-files-found: error
