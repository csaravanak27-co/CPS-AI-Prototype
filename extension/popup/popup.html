<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <title>C.P.S. — AI Coding Companion</title>
  <style>
    /* ====================================================================
     * C.P.S. Popup — Dark Theme
     * ==================================================================== */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      min-height: 480px;
      background: #0b1220;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* --- Header --- */
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid #1e2d44;
      background: linear-gradient(135deg, #0d1829 0%, #0b1220 100%);
    }

    .popup-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .popup-logo .icon {
      font-size: 26px;
      filter: drop-shadow(0 0 8px rgba(74, 222, 181, 0.4));
    }

    .popup-logo .text {
      display: flex;
      flex-direction: column;
    }

    .popup-logo .name {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #4adeb5, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .popup-logo .tagline {
      font-size: 10px;
      color: #5a6a80;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* --- Connection Status --- */
    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #8899b0;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(30, 45, 68, 0.5);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f87171;
      transition: background 300ms ease;
    }

    .status-dot.connected {
      background: #34d399;
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
    }

    /* --- Content --- */
    .popup-content {
      padding: 16px 20px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: #5a6a80;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* --- Action Cards --- */
    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: #111d32;
      border: 1px solid #1e2d44;
      border-radius: 10px;
      cursor: pointer;
      transition: all 180ms ease;
      text-decoration: none;
      color: inherit;
    }

    .action-card:hover {
      background: #1a2940;
      border-color: #4adeb5;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .action-card:active {
      transform: scale(0.98);
      background: #243550;
    }

    .action-card .card-icon {
      font-size: 22px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(74, 222, 181, 0.08);
      border-radius: 8px;
      flex-shrink: 0;
    }

    .action-card .card-content {
      flex: 1;
    }

    .action-card .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .action-card .card-desc {
      font-size: 11px;
      color: #5a6a80;
      margin-top: 2px;
    }

    .action-card .card-arrow {
      font-size: 14px;
      color: #3a4a5f;
      transition: color 180ms ease, transform 180ms ease;
    }

    .action-card:hover .card-arrow {
      color: #4adeb5;
      transform: translateX(2px);
    }

    /* Primary action styling */
    .action-card.primary {
      background: linear-gradient(135deg, rgba(74, 222, 181, 0.1) 0%, rgba(56, 189, 248, 0.08) 100%);
      border-color: rgba(74, 222, 181, 0.3);
    }

    .action-card.primary:hover {
      border-color: #4adeb5;
      box-shadow: 0 4px 20px rgba(74, 222, 181, 0.15);
    }

    /* --- Status Message --- */
    .status-message {
      margin-top: 12px;
      padding: 10px 14px;
      background: #111d32;
      border-radius: 8px;
      font-size: 12px;
      color: #8899b0;
      border-left: 3px solid #38bdf8;
      display: none;
    }

    .status-message.visible {
      display: block;
    }

    .status-message.error {
      border-left-color: #f87171;
      color: #fca5a5;
    }

    .status-message.success {
      border-left-color: #34d399;
      color: #6ee7b7;
    }

    /* --- Footer --- */
    .popup-footer {
      padding: 12px 20px;
      border-top: 1px solid #1e2d44;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #3a4a5f;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .popup-footer a {
      color: #4adeb5;
      text-decoration: none;
      transition: color 180ms ease;
    }

    .popup-footer a:hover {
      color: #38bdf8;
    }

    /* --- Loading --- */
    .loading-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #1e2d44;
      border-top-color: #4adeb5;
      border-radius: 50%;
      animation: spin 600ms linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="popup-header">
    <div class="popup-logo">
      <span class="icon">⚡</span>
      <div class="text">
        <span class="name">C.P.S.</span>
        <span class="tagline">AI Coding Companion</span>
      </div>
    </div>
    <div class="connection-status" id="connectionStatus">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Checking…</span>
    </div>
  </div>

  <!-- Content -->
  <div class="popup-content">
    <div class="section-label">Quick Actions</div>

    <div class="actions-grid">
      <!-- Open Sidebar -->
      <div class="action-card primary" id="actionSidebar">
        <div class="card-icon">🔍</div>
        <div class="card-content">
          <div class="card-title">Open Sidebar</div>
          <div class="card-desc">Full AI assistant panel</div>
        </div>
        <div class="card-arrow">→</div>
      </div>

      <!-- Explain Selection -->
      <div class="action-card" id="actionExplain" data-action="explain">
        <div class="card-icon">💡</div>
        <div class="card-content">
          <div class="card-title">Explain Selection</div>
          <div class="card-desc">Understand highlighted code</div>
        </div>
        <div class="card-arrow">→</div>
      </div>

      <!-- Generate Code -->
      <div class="action-card" id="actionGenerate" data-action="generate">
        <div class="card-icon">⚡</div>
        <div class="card-content">
          <div class="card-title">Generate Code</div>
          <div class="card-desc">Create code from description</div>
        </div>
        <div class="card-arrow">→</div>
      </div>

      <!-- Debug Code -->
      <div class="action-card" id="actionDebug" data-action="debug">
        <div class="card-icon">🐛</div>
        <div class="card-content">
          <div class="card-title">Debug Code</div>
          <div class="card-desc">Find and fix bugs</div>
        </div>
        <div class="card-arrow">→</div>
      </div>

      <!-- Security Scan -->
      <div class="action-card" id="actionSecurity" data-action="security">
        <div class="card-icon">🛡️</div>
        <div class="card-content">
          <div class="card-title">Security Scan</div>
          <div class="card-desc">Analyse for vulnerabilities</div>
        </div>
        <div class="card-arrow">→</div>
      </div>
    </div>

    <!-- Status Message -->
    <div class="status-message" id="statusMessage"></div>
  </div>

  <!-- Footer -->
  <div class="popup-footer">
    <span>C.P.S. v1.0.0</span>
    <span>Built with ❤️</span>
  </div>

  <script src="../shared/browser-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
